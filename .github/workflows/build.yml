name: ACL GUI • Windows / macOS / Linux

on:
  push:
    branches:
      - ACL-GUI
    tags:
      - 'v*'
  pull_request:
    branches:
      - ACL-GUI
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acl-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            command: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
          - platform: macos-intel
            os: macos-15-intel
            command: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --publish never
          - platform: macos-arm64
            os: macos-15
            command: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --publish never
          - platform: linux
            os: ubuntu-22.04
            command: npx electron-builder --config electron-builder.config.cjs --linux AppImage deb --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Checkout ACL-GUI
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Python 3.12 (build-time checks)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify macOS build architecture
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          echo "Runner architecture: $(uname -m)"
          if [ "${{ matrix.platform }}" = 'macos-intel' ]; then
            test "$(uname -m)" = 'x86_64'
          else
            test "$(uname -m)" = 'arm64'
          fi
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify keyboard shortcuts and editor core
        run: |
          npm run test:shortcuts
          npm run test:editor
          npm run test:snapping
          npm run test:clips
          npm run test:waveform
          npm run test:history
          npm run test:envelope
          npm run test:timeline-scroll
          npm run test:fx-clips
          npm run test:project
          npm run test:standalone
      - name: Verify Python source syntax
        run: python -m compileall -q ../backend ../processor.py ../common.py ../bootstrap.py
      - name: Fetch Windows FFmpeg for package
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: .
        run: python -c "from bootstrap import install_ffmpeg; install_ffmpeg()"
      - name: Compile React and TypeScript
        run: npm run build
      - name: Package ${{ matrix.platform }}
        shell: bash
        run: ${{ matrix.command }}
      - name: Upload ${{ matrix.platform }} installers
        uses: actions/upload-artifact@v4
        with:
          name: ACL-GUI-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            dist-installers/*.exe
            dist-installers/*.dmg
            dist-installers/*.zip
            dist-installers/*.AppImage
            dist-installers/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          pattern: ACL-GUI-*
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: true
